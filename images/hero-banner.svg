<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04324f"/>
      <stop offset="100%" stop-color="#02182a"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0b34c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0b34c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#skyGrad)"/>

  <!-- Soft glow behind the growth line -->
  <circle cx="950" cy="140" r="220" fill="#e0b34c" opacity="0.06"/>

  <!-- Scattered accent dots -->
  <circle cx="120" cy="70" r="3" fill="#e0b34c" opacity="0.5"/>
  <circle cx="300" cy="45" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="520" cy="90" r="2.5" fill="#e0b34c" opacity="0.4"/>
  <circle cx="780" cy="55" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="1000" cy="80" r="2" fill="#e0b34c" opacity="0.5"/>
  <circle cx="1120" cy="40" r="2.5" fill="#ffffff" opacity="0.4"/>

  <!-- City skyline silhouette -->
  <g fill="#022338">
    <rect x="0"    y="260" width="60" height="140"/>
    <rect x="60"   y="300" width="40" height="100"/>
    <rect x="100"  y="220" width="70" height="180"/>
    <rect x="170"  y="280" width="50" height="120"/>
    <rect x="220"  y="180" width="90" height="220"/>
    <rect x="252"  y="160" width="10" height="20"/>
    <rect x="310"  y="310" width="45" height="90"/>
    <rect x="355"  y="240" width="65" height="160"/>
    <rect x="420"  y="290" width="55" height="110"/>
    <rect x="475"  y="200" width="80" height="200"/>
    <rect x="555"  y="320" width="40" height="80"/>
    <rect x="595"  y="250" width="60" height="150"/>
    <rect x="655"  y="210" width="90" height="190"/>
    <rect x="745"  y="300" width="50" height="100"/>
    <rect x="795"  y="230" width="70" height="170"/>
    <rect x="865"  y="270" width="55" height="130"/>
    <rect x="920"  y="190" width="85" height="210"/>
    <rect x="1005" y="305" width="45" height="95"/>
    <rect x="1050" y="240" width="65" height="160"/>
    <rect x="1115" y="220" width="85" height="180"/>
  </g>

  <!-- Window lights -->
  <g fill="#e0b34c" opacity="0.5">
    <rect x="12" y="280" width="6" height="8"/>
    <rect x="28" y="300" width="6" height="8"/>
    <rect x="112" y="240" width="6" height="8"/>
    <rect x="130" y="260" width="6" height="8"/>
    <rect x="150" y="280" width="6" height="8"/>
    <rect x="240" y="200" width="6" height="8"/>
    <rect x="260" y="230" width="6" height="8"/>
    <rect x="280" y="260" width="6" height="8"/>
    <rect x="370" y="260" width="6" height="8"/>
    <rect x="390" y="290" width="6" height="8"/>
    <rect x="495" y="220" width="6" height="8"/>
    <rect x="515" y="250" width="6" height="8"/>
    <rect x="535" y="280" width="6" height="8"/>
    <rect x="670" y="230" width="6" height="8"/>
    <rect x="695" y="260" width="6" height="8"/>
    <rect x="720" y="290" width="6" height="8"/>
    <rect x="810" y="250" width="6" height="8"/>
    <rect x="830" y="280" width="6" height="8"/>
    <rect x="940" y="210" width="6" height="8"/>
    <rect x="960" y="240" width="6" height="8"/>
    <rect x="980" y="270" width="6" height="8"/>
    <rect x="1065" y="260" width="6" height="8"/>
    <rect x="1130" y="240" width="6" height="8"/>
    <rect x="1150" y="270" width="6" height="8"/>
  </g>

  <!-- Rising growth line (area + stroke) -->
  <polygon points="50,320 200,285 350,300 500,225 650,245 800,155 950,175 1100,95 1150,75 1150,400 50,400"
           fill="url(#areaGrad)"/>
  <polyline points="50,320 200,285 350,300 500,225 650,245 800,155 950,175 1100,95 1150,75"
            fill="none" stroke="#e0b34c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#e0b34c">
    <circle cx="50"   cy="320" r="5"/>
    <circle cx="350"  cy="300" r="5"/>
    <circle cx="650"  cy="245" r="5"/>
    <circle cx="950"  cy="175" r="5"/>
    <circle cx="1150" cy="75"  r="6"/>
  </g>
</svg>
